name: nur_islamic_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  http: ^1.2.0
  audioplayers: ^6.6.0
  wakelock_plus: ^1.2.8
  flutter_compass: ^0.8.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  hijri: ^3.0.1
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.1.0
  android_intent_plus: ^4.0.3
  timezone: ^0.9.4
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: fonts/NotoSansBengali-Regular.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: fonts/NotoNaskhArabic-Regular.ttf
  assets:
    - audio/
    - images/